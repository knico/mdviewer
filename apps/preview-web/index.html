<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://document.mdviewer.local data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>mdviewer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header><span class="brand">md<span>viewer</span></span><span id="document-title">Markdown Preview</span><button id="theme" aria-label="Switch theme">◐</button></header>
  <main><article class="markdown-body"><h1>Ready to read.</h1><p>Open a Markdown document, then choose <strong>Plugins → mdviewer → Preview</strong>.</p></article></main>
  <footer id="status" role="status">Local preview · no network required</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
